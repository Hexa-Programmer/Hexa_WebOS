<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hexa WebOS</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            user-select: none;
        }

        body {
            background-image: url('./bg.gif');
            background-size: cover;
            background-position: center;
            height: 100vh;
            overflow: hidden;
            color: #fff;
        }

        .taskbar {
            position: absolute;
            top: 12px;
            left: 16px;
            right: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 16px;
            background: rgba(18, 18, 18, 0.45);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 24px;
            font-size: 13px;
            font-weight: 500;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.25);
        }

        .badge {
            background: rgba(255, 255, 255, 0.12);
            padding: 4px 12px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            cursor: pointer;
        }

        .window-card {
            width: 360px;
            position: absolute;
            top: calc(50% - 140px);
            left: calc(50% - 180px);
            background: rgba(20, 20, 24, 0.65);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 16px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .window-header {
            display: flex;
            align-items: center;
            padding: 12px 16px;
            background: rgba(255, 255, 255, 0.04);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            cursor: grab;
        }

        .window-header:active {
            cursor: grabbing;
        }

        .window-dots {
            display: flex;
            gap: 6px;
            margin-right: 12px;
        }

        .dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            display: inline-block;
        }

        .dot.red { 
            background-color: #ff5f56; 
            cursor: pointer; 
        }
        
        .dot.yellow { background-color: #ffbd2e; }
        .dot.green { background-color: #27c93f; }

        .window-title {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.6);
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .window-body {
            padding: 20px;
            user-select: text;
        }

        .window-body h1 {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 8px;
            color: #ffffff;
        }

        .window-body p {
            font-size: 13.5px;
            line-height: 1.6;
            color: rgba(255, 255, 255, 0.78);
        }
    </style>
</head>
<body>

    <div class="taskbar">
        <span class="badge" id="windowopen">Hexa_WebOS</span>
        <span style="font-family: serif; font-size: 15px;">Building <i>thoughtful</i> software</span>
        <span class="badge" id="timeElement">Time</span>
    </div>

    <div id="window" class="window-card">
        <div id="windowheader" class="window-header">
            <div class="window-dots">

                <span id="windowclose" class="dot red"></span>
                <span class="dot yellow"></span>
                <span class="dot green"></span>
            </div>
            <span class="window-title">About Me</span>
        </div>
        <div class="window-body">
            <h1>Hexa-Programmer</h1>
            <p>
                Programmer building software, OSS tools, and products that solve real problems.
                Exploring new ideas, shipping fast, and working towards the next big thing.
            </p>
        </div>
    </div>
    <div id="desktopApps" style="padding-top: 64px;">
            <div style="text-align: center; padding: 16px; filter: drop-shadow(0 0 8px black); width: fit-content">
            <img src="./hexanotes.png" style="width: 64px; height: 64px; border-radius: 16px;">
            <p style="margin: 0px; color: #fff; ">HexaNotes</p>
            </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
