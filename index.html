<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hexa WebOS</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            user-select: none;
        }

        body {
            background-image: url('./bg.gif');
            background-size: cover;
            background-position: center;
            height: 100vh;
            overflow: hidden;
            color: #fff;
        }

        .taskbar {
            position: absolute;
            top: 12px;
            left: 16px;
            right: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 16px;
            background: rgba(18, 18, 18, 0.45);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 24px;
            font-size: 13px;
            font-weight: 500;   
        }

        .welcome {
            background: rgba(255, 255, 255, 0.12);
            padding: 4px 12px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            cursor: pointer;
        }

        .time {
            background: rgba(255, 255, 255, 0.12);
            padding: 4px 12px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .window-card {
            width: 360px;
            position: absolute;
            top: calc(50% - 140px);
            left: calc(50% - 180px);
            background: rgba(20, 20, 24, 0.65);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 16px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .window-header {
            display: flex;
            align-items: center;
            padding: 12px 16px;
            background: rgba(255, 255, 255, 0.04);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            cursor: grab;
        }

        .window-header:active {
            cursor: grabbing;
        }

        .window-dots {
            display: flex;
            gap: 6px;
            margin-right: 12px;
        }

        .dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            display: inline-block;
        }

        .dot.red { 
            background-color: #ff5f56; 
            cursor: pointer; 
        }
        
        .dot.blue { background-color: #00bbff; }
        .dot.purple { background-color: rgb(175, 16, 184); }

        .window-title {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.6);
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .window-body {
            padding: 20px;
            user-select: text;
        }

        .window-body h1 {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 8px;
            color: #ffffff;
        }

        .window-body p {
            font-size: 13.5px;
            line-height: 1.6;
            color: rgba(255, 255, 255, 0.78);
        }

        .selected {
            background-color: rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            width: min-content;
            cursor: pointer;
        }

        #HexaNotes {
            cursor: pointer;
        }

        .closebutton {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background-color: #ff5f56;
            cursor: pointer;
        }
        .window {
            position: absolute;
            border-radius: 16px;
            background-color: rgba(20, 20, 24, 0.65);
            border: 1px solid rgba(255, 255, 255, 0.15);
            display: none; 
            flex-direction: column;
            overflow: hidden;
        }

        .windowheader {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 14px;
            cursor: grab;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            background: rgba(255, 255, 255, 0.04);
        }

        .headertext {
            margin: 0px;
            color: #fff;
            font-size: 13px;
            font-weight: 500;
        }

        .HexaNotes_Window {
            background-color: rgba(242, 0, 255, 0.219);
            margin: 6px;
            border-radius: 12px;
            width: 520px;
            height: 420px;
            padding: 16px;
        }

    </style>
</head>
<body>

    <div class="taskbar">
        <span class="welcome" id="windowopen">Hexa_WebOS</span>
        <span style="font-family: serif; font-size: 15px;">Building <i>thoughtful</i> software</span>
        <span class="time" id="timeElement">Time</span>
    </div>

    <div id="window" class="window-card">
        <div id="windowheader" class="window-header">
            <div class="window-dots">
                <span id="windowclose" class="dot red"></span>
                <span class="dot purple"></span>
                <span class="dot blue"></span>
            </div>
            <span class="window-title">About Me</span>
        </div>
        <div class="window-body">
            <h1>Hexa-Programmer</h1>
            <p>
                Programmer building software, OSS tools, and products that solve real problems.
                Exploring new ideas, shipping fast, and working towards the next big thing.
            </p>
        </div>
    </div>

    <div id="desktopApps" style="padding-top: 64px;">
        <div id="HexaNotes">
            <img src="./hexanotes.png" style="width: 64px; height: 64px; border-radius: 16px;">
            <p style="margin: 0px; color: #fff;">HexaNotes</p>
        </div>
    </div>

    <div class="window" id="noteswindow" style="top: calc(50% - 240px); left: calc(50% - 260px);">
        <div class="windowheader" id="noteswindowheader">
            <div class="window-dots">
                <span id="notesclose" class="dot red"></span>
                <span class="dot purple"></span>
                <span class="dot blue"></span>
            </div>
            <p class="headertext">Notes</p>
            <div style="width: 12px; margin-right: 6px; height: 12px;"></div>
        </div>

        <div class="HexaNotes_Window">
            <p>HexaNotes</p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
